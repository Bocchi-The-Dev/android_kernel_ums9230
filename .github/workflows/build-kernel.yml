name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 'Device codename to match (ro.product.device / ro.build.product)'
        required: false
        default: 'M5A'
        type: string
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils zip git

      - name: Build Image
        run: |
          make LLVM=1 LLVM_IAS=1 O="out" unisoc_defconfig
          make LLVM=1 LLVM_IAS=1 O="out" -j$(nproc) Image

      - name: Clone AnyKernel3 template
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Configure anykernel.sh
        env:
          DEVICE_NAME: ${{ github.event.inputs.device_name || 'M5A' }}
        run: |
          cd AnyKernel3
          sed -i 's/^kernel.string=.*/kernel.string=NovaKernel | Infinix Smart 8 (X6525)/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i "s/^device.name1=.*/device.name1=${DEVICE_NAME}/" anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=X6525/' anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=Infinix-X6525/' anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=Smart8/' anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=M5A/' anykernel.sh
          sed -i 's#^block=.*#block=/dev/block/bootdevice/by-name/boot;#' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=1;/' anykernel.sh

      - name: Package AnyKernel3 zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 "../NovaKernel-X6525-${GITHUB_SHA::7}.zip" . -x ".git*" "README.md"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: NovaKernel-X6525-${{ github.sha }}
          path: NovaKernel-X6525-*.zip
          if-no-files-found: warn
