name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # Everything the kernel build needs is preinstalled from the
          # Ubuntu archive. Third-party repos (notably dl.google.com)
          # regularly break 'apt-get update' with hash mismatches, so
          # remove the offending source by content (whatever file holds
          # it) and don't let a stale mirror fail the whole job.
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update || true
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils

      - name: Build Image
        run: |
          make LLVM=1 LLVM_IAS=1 O="out" unisoc_defconfig
          make LLVM=1 LLVM_IAS=1 O="out" -j$(nproc) Image

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: warn
